# ============================================================================
# 020-logging-config.yaml
# Structured logging configuration for Python (dictConfig) and tips
# ============================================================================
#
# HOW TO USE:
#   1. Copy to your project (e.g., logging.yaml or config/logging.yaml)
#   2. Load in Python:
#      import yaml
#      import logging.config
#      with open('logging.yaml', 'r') as f:
#          config = yaml.safe_load(f)
#          logging.config.dictConfig(config)
#   3. Use: logger = logging.getLogger(__name__)
#
# ALTERNATIVES:
#   - structlog for structured logging
#   - python-json-logger for JSON output
#   - loguru for simpler API
#
# ============================================================================

version: 1
disable_existing_loggers: false

# ============================================================================
# Formatters
# ============================================================================
formatters:
  # Standard text format for development
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  # Detailed format with more context
  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d | %(process)d:%(thread)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  # Simple format for console
  simple:
    format: "%(levelname)-8s | %(message)s"

  # JSON format for production (requires python-json-logger)
  # Uncomment and install: pip install python-json-logger
  # json:
  #   (): pythonjsonlogger.jsonlogger.JsonFormatter
  #   format: "%(asctime)s %(levelname)s %(name)s %(message)s"
  #   datefmt: "%Y-%m-%dT%H:%M:%S%z"
  #   json_indent: null  # null for compact, 2 for pretty
  #   json_fields:
  #     timestamp: asctime
  #     level: levelname
  #     logger: name
  #     message: message
  #     module: module
  #     function: funcName
  #     line: lineno

# ============================================================================
# Filters (optional)
# ============================================================================
filters:
  # Filter to only show warnings and above
  warnings_and_above:
    (): __main__.WarningsAndAboveFilter
  
  # Example: Filter to add request_id to all logs
  # request_id:
  #   (): myapp.logging.RequestIdFilter

# ============================================================================
# Handlers
# ============================================================================
handlers:
  # Console handler - for development
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

  # Console handler - minimal output
  console_simple:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  # File handler - rotating logs
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  # Error file handler - only errors
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  # Timed rotating file handler - daily logs
  daily_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/daily.log
    when: midnight
    interval: 1
    backupCount: 30  # Keep 30 days
    encoding: utf-8

  # JSON file handler for production (requires python-json-logger)
  # json_file:
  #   class: logging.handlers.RotatingFileHandler
  #   level: INFO
  #   formatter: json
  #   filename: logs/app.json.log
  #   maxBytes: 10485760
  #   backupCount: 5
  #   encoding: utf-8

  # Queue handler for async logging (Python 3.12+)
  # queue:
  #   class: logging.handlers.QueueHandler
  #   queue: myapp.log_queue
  #   handlers: [file, console]

# ============================================================================
# Loggers
# ============================================================================
loggers:
  # Application logger
  myapp:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false

  # Specific module loggers
  myapp.database:
    level: INFO
    handlers: [console, file]
    propagate: false

  myapp.api:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  # Third-party loggers - reduce noise
  urllib3:
    level: WARNING
    handlers: [console]
    propagate: false

  requests:
    level: WARNING
    handlers: [console]
    propagate: false

  sqlalchemy:
    level: WARNING
    handlers: [console]
    propagate: false

  sqlalchemy.engine:
    level: INFO  # Set to DEBUG to see SQL queries
    handlers: [console]
    propagate: false

  # Async libraries
  asyncio:
    level: WARNING
    handlers: [console]
    propagate: false

  aiohttp:
    level: WARNING
    handlers: [console]
    propagate: false

# ============================================================================
# Root Logger
# ============================================================================
root:
  level: INFO
  handlers: [console, file]


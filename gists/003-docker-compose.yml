# ============================================================================
# 003-docker-compose.yml
# Docker Compose for app + PostgreSQL + Adminer
# ============================================================================
#
# HOW TO USE:
#   1. Copy to your project root
#   2. Create a .env file with your secrets (see example below)
#   3. Run: docker compose up -d
#   4. Access:
#      - App: http://localhost:3000
#      - Adminer: http://localhost:8080
#
# ENV EXAMPLE (.env file):
#   POSTGRES_USER=myapp
#   POSTGRES_PASSWORD=secretpassword123
#   POSTGRES_DB=myapp_db
#   JWT_SECRET=your-jwt-secret-here
#
# ============================================================================

services:
  # ==========================================================================
  # Application Service
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: myapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: myapp-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-myapp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-myapp_db}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optional: Mount init scripts
      # - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myapp} -d ${POSTGRES_DB:-myapp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Adminer - Database Management UI
  # ==========================================================================
  adminer:
    image: adminer:latest
    container_name: myapp-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=hydra
    depends_on:
      - postgres
    networks:
      - app-network

  # ==========================================================================
  # Optional: Redis Cache
  # ==========================================================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: myapp-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   command: redis-server --appendonly yes
  #   networks:
  #     - app-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

# ============================================================================
# Networks
# ============================================================================
networks:
  app-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres-data:
    driver: local
  # redis-data:
  #   driver: local

# ============================================================================
# PRODUCTION NOTES:
# - Never commit .env files with real secrets
# - Use Docker secrets or external secret managers in production
# - Consider using docker compose profiles for dev/prod separation
# - Add resource limits (deploy.resources) for production
# ============================================================================
